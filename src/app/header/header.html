        <app-team-selector></app-team-selector>
    </div>
        <nav class="main-nav">
            <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a routerLink="/projetos" routerLinkActive="active" class="nav-link"><i class="fas fa-robot"></i> Projetos</a>
